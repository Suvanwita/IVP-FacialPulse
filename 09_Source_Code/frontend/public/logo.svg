<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#fpGrad)" filter="url(#glow)"/>

  <!-- Subtle face contour outline -->
  <path d="M 30 36 C 30 24, 70 24, 70 36 C 70 54, 62 68, 50 74 C 38 68, 30 54, 30 36 Z" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Scanning corner brackets -->
  <path d="M 24 32 L 24 24 L 32 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 76 32 L 76 24 L 68 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24 68 L 24 76 L 32 76" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 76 68 L 76 76 L 68 76" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulse Wave across face -->
  <path d="M 16 50 L 34 50 L 40 42 L 46 62 L 53 32 L 60 56 L 65 50 L 84 50" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulse nodes -->
  <circle cx="53" cy="32" r="3" fill="#FF5252" />
  <circle cx="50" cy="50" r="1.5" fill="#FFFFFF" />
</svg>
